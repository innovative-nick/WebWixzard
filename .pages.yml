# Pages CMS configuration (https://pagescms.org)
# Log in at https://app.pagescms.org with GitHub and open this repository to edit content.
media:
  input: public/media
  output: /media

content:
  - name: projects
    label: Portfolio projects
    type: collection
    path: src/content/projects
    filename: "{primary}.md"
    view:
      fields: [title, platform, published, featured]
      primary: title
      sort: order
      order: asc
    fields:
      - name: title
        label: Project title
        type: string
        required: true
      - name: client
        label: Client name
        type: string
      - name: industry
        label: Industry
        type: string
      - name: summary
        label: One-line summary
        type: text
        description: Shown on project cards and at the top of the project page.
      - name: cover
        label: Cover image (website screenshot, 16:10 works best)
        type: image
      - name: liveUrl
        label: Live website URL
        type: string
      - name: platform
        label: Platform
        type: select
        options:
          values: [WordPress, Webflow, GoHighLevel, Wix Studio, Shopify, Framer, Custom code]
      - name: services
        label: Services provided
        type: string
        list: true
      - name: year
        label: Year
        type: string
      - name: featured
        label: Show on homepage
        type: boolean
        default: true
      - name: published
        label: Published (visible on the site)
        type: boolean
        default: true
      - name: order
        label: Display order (1 shows first)
        type: number
        default: 10
      - name: body
        label: Case study (optional)
        type: rich-text

  - name: testimonials
    label: Testimonials
    type: file
    path: src/data/testimonials.json
    format: json
    list: true
    fields:
      - name: quote
        label: Quote
        type: text
        required: true
      - name: name
        label: Name
        type: string
        required: true
      - name: role
        label: Role
        type: string
      - name: company
        label: Company
        type: string

  - name: pricing
    label: Pricing packages
    type: file
    path: src/data/pricing.json
    format: json
    list: true
    fields:
      - name: name
        label: Package name
        type: string
        required: true
      - name: price
        label: Price (e.g. $1,200)
        type: string
        required: true
      - name: note
        label: Price note (e.g. One-time)
        type: string
      - name: summary
        label: Short description
        type: text
      - name: popular
        label: Mark as most popular
        type: boolean
      - name: features
        label: What's included
        type: string
        list: true

  - name: faqs
    label: FAQs
    type: file
    path: src/data/faqs.json
    format: json
    list: true
    fields:
      - name: question
        label: Question
        type: string
        required: true
      - name: answer
        label: Answer
        type: text
        required: true

  - name: settings
    label: Contact & social links
    type: file
    path: src/data/settings.json
    format: json
    fields:
      - { name: siteName, label: Site name, type: string }
      - { name: siteUrl, label: Site URL, type: string }
      - { name: description, label: SEO description, type: text }
      - { name: email, label: Email, type: string }
      - { name: phone, label: Phone, type: string }
      - { name: calendlyUrl, label: Booking link (Calendly), type: string }
      - { name: responseTime, label: Response time line, type: string }
      - { name: facebook, label: Facebook URL, type: string }
      - { name: instagram, label: Instagram URL, type: string }
      - { name: linkedin, label: LinkedIn URL, type: string }
      - { name: youtube, label: YouTube URL, type: string }
      - { name: tiktok, label: TikTok URL, type: string }
      - { name: whatsapp, label: WhatsApp link (https://wa.me/...), type: string }
