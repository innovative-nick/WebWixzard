# Pages CMS configuration (https://pagescms.org)
# Log in at https://app.pagescms.org with GitHub and open this repository to edit content.
media:
  input: public/media
  output: /media

content:
  - name: projects
    label: Portfolio projects
    type: collection
    path: src/content/projects
    filename: "{primary}.md"
    view:
      fields: [title, published, order]
      primary: title
      sort: order
      order: asc
    fields:
      - name: title
        label: Project name (not shown on the site, used for your reference and image alt text)
        type: string
        required: true
      - name: cover
        label: Portfolio image (square, e.g. 1000×1000 laptop mockup)
        type: image
        required: true
      - name: liveUrl
        label: Live website URL
        type: string
      - name: published
        label: Show on the website
        type: boolean
        default: true
      - name: order
        label: Display order (1 shows first)
        type: number
        default: 10

  - name: logos
    label: Client logos strip
    type: file
    path: src/data/logos.json
    format: json
    list: true
    fields:
      - name: name
        label: Client name
        type: string
      - name: image
        label: Logo
        type: image

  - name: testimonials
    label: Testimonials
    type: file
    path: src/data/testimonials.json
    format: json
    list: true
    fields:
      - name: quote
        label: Quote
        type: text
        required: true
      - name: name
        label: Name
        type: string
        required: true
      - name: role
        label: Role
        type: string
      - name: company
        label: Company
        type: string

  - name: pricing
    label: Pricing packages
    type: file
    path: src/data/pricing.json
    format: json
    list: true
    fields:
      - name: name
        label: Package name
        type: string
        required: true
      - name: summary
        label: Short description
        type: text
      - name: price
        label: Price without the $ sign (e.g. 1,200)
        type: string
        required: true
      - name: note
        label: Price note
        type: string
      - name: popular
        label: Mark as Most Popular
        type: boolean
      - name: features
        label: What's included
        type: string
        list: true

  - name: faqs
    label: FAQs
    type: file
    path: src/data/faqs.json
    format: json
    list: true
    fields:
      - name: question
        label: Question
        type: string
        required: true
      - name: answer
        label: Answer
        type: text
        required: true

  - name: settings
    label: Contact & social links
    type: file
    path: src/data/settings.json
    format: json
    fields:
      - { name: siteName, label: Site name, type: string }
      - { name: siteUrl, label: Site URL, type: string }
      - { name: description, label: SEO description, type: text }
      - { name: email, label: Email, type: string }
      - { name: phone, label: Phone, type: string }
      - { name: calendlyUrl, label: Booking link (Calendly), type: string }
      - { name: instagram, label: Instagram URL (leave empty to hide), type: string }
      - { name: linkedin, label: LinkedIn URL (leave empty to hide), type: string }
      - { name: web3formsKey, label: Web3Forms access key (form notifications), type: string }
